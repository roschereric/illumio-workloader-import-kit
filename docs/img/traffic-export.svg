6" rx="4" fill="white" stroke="#313638"/><text x="178" y="101.0" text-anchor="start" fill="#313638" font-size="12">Time: Last 7 days ▾ (custom range)</text><rect x="410" y="84" width="200" height="26" rx="4" fill="white" stroke="#313638"/><text x="418" y="101.0" text-anchor="start" fill="#313638" font-size="12">Reported ▾  |  Draft</text><rect x="620" y="84" width="160" height="26" rx="4" fill="white" stroke="#313638"/><text x="628" y="101.0" text-anchor="start" fill="#313638" font-size="12">More ▾ › Results Settings</text><circle cx="170" cy="84" r="11" fill="#FF5500"/><text x="170" y="88" fill="white" text-anchor="middle" font-weight="700" font-size="12">3</text><circle cx="620" cy="84" r="11" fill="#FF5500"/><text x="620" y="88" fill="white" text-anchor="middle" font-weight="700" font-size="12">5</text><rect x="790" y="84" width="100" height="26" rx="4" fill="white" stroke="#313638"/><text x="798" y="101.0" text-anchor="start" fill="#313638" font-size="12">Load Results</text><rect x="170" y="126" width="720" height="22" fill="#313638"/><text x="176" y="141" fill="white" font-size="11" font-weight="700">Source</text><text x="296" y="141" fill="white" font-size="11" font-weight="700">Destination</text><text x="416" y="141" fill="white" font-size="11" font-weight="700">Port/Proto</text><text x="496" y="141" fill="white" font-size="11" font-weight="700">Process</text><text x="586" y="141" fill="white" font-size="11" font-weight="700">Flows</text><text x="646" y="141" fill="white" font-size="11" font-weight="700">Policy decision</text><text x="766" y="141" fill="white" font-size="11" font-weight="700">First / Last</text><rect x="170" y="148" width="720" height="22" fill="#F7F4EE" stroke="#e5e2db"/><text x="176" y="163" fill="#313638" font-size="11">10.0.4.11</text><text x="296" y="163" fill="#313638" font-size="11">atun4.ux…</text><text x="416" y="163" fill="#313638" font-size="11">8080 TCP</text><text x="496" y="163" fill="#313638" font-size="11">java</text><text x="586" y="163" fill="#313638" font-size="11">21,025</text><text x="646" y="163" fill="#313638" font-size="11">Unenforced Deny</text><text x="766" y="163" fill="#313638" font-size="11">Sep 1 → Sep 2</text><rect x="170" y="170" width="720" height="22" fill="white" stroke="#e5e2db"/><text x="176" y="185" fill="#313638" font-size="11">10.43.43.21</text><text x="296" y="185" fill="#313638" font-size="11">atun4.ux…</text><text x="416" y="185" fill="#313638" font-size="11">10050 TCP</text><text x="496" y="185" fill="#313638" font-size="11">zabbix_agentd</text><text x="586" y="185" fill="#313638" font-size="11">24,751</text><text x="646" y="185" fill="#313638" font-size="11">Unenforced Deny</text><text x="766" y="185" fill="#313638" font-size="11">Sep 1 → Sep 2</text><rect x="170" y="192" width="720" height="22" fill="#F7F4EE" stroke="#e5e2db"/><text x="176" y="207" fill="#313638" font-size="11">172.27.1.6</text><text x="296" y="207" fill="#313638" font-size="11">wlsfp1a…</text><text x="416" y="207" fill="#313638" font-size="11">7003 TCP</text><text x="496" y="207" fill="#313638" font-size="11">java</text><text x="586" y="207" fill="#313638" font-size="11">170,965</text><text x="646" y="207" fill="#313638" font-size="11">No Rule</text><text x="766" y="207" fill="#313638" font-size="11">Aug 26 → Sep 2</text><rect x="170" y="214" width="720" height="22" fill="white" stroke="#e5e2db"/><text x="176" y="229" fill="#313638" font-size="11">occ9prohsapv02</text><text x="296" y="229" fill="#313638" font-size="11">169.254.169.254</text><text x="416" y="229" fill="#313638" font-size="11">53 UDP</text><text x="496" y="229" fill="#313638" font-size="11">—</text><text x="586" y="229" fill="#313638" font-size="11">5,225,842</text><text x="646" y="229" fill="#313638" font-size="11">Allowed</text><text x="766" y="229" fill="#313638" font-size="11">Aug 26 → Sep 2</text><rect x="170" y="236" width="720" height="22" fill="#F7F4EE" stroke="#e5e2db"/><text x="176" y="251" fill="#313638" font-size="11">…</text><text x="296" y="251" fill="#313638" font-size="11">…</text><text x="416" y="251" fill="#313638" font-size="11">…</text><text x="496" y="251" fill="#313638" font-size="11">…</text><text x="586" y="251" fill="#313638" font-size="11">…</text><text x="646" y="251" fill="#313638" font-size="11">…</text><text x="766" y="251" fill="#313638" font-size="11">…</text><rect x="760" y="270" width="130" height="28" rx="4" fill="white" stroke="#FF5500"/><text x="825.0" y="288.0" text-anchor="middle" fill="#313638" font-weight="700" font-size="12">⤓ Export</text><circle cx="760" cy="270" r="11" fill="#FF5500"/><text x="760" y="274" fill="white" text-anchor="middle" font-weight="700" font-size="12">6</text><text x="170" y="300" fill="#8A8D8F" font-size="11">Showing 5,000 of 5,000 results — raise the limit in More › Results Settings before exporting (see step 5)</text><text x="170" y="330" fill="#313638" font-size="11">1 Explore › Traffic (called Explorer in older consoles)</text><text x="170" y="346" fill="#313638" font-size="11">2 Filters: destination = the workloads/labels in scope; add Exclusions (More › Show Exclusion Filters) for scanners</text><text x="170" y="362" fill="#313638" font-size="11">3 Time range: 7 days for a first pass; longer windows hit the results cap sooner</text><text x="170" y="378" fill="#313638" font-size="11">4 Run — wait for the query to finish (Load Results reopens queries from the last 24 h)</text><text x="170" y="394" fill="#313638" font-size="11">5 More › Results Settings: raise the maximum results (UI 100,000; CSV export up to 200,000) so the export is not truncated</text><text x="170" y="410" fill="#313638" font-size="11">6 Export — downloads TrafficData … .csv; open it as text, never let Excel convert the IP columns</text></svg>