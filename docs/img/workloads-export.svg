<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="900" height="330" fill="white"/>
<rect x="0" y="0" width="900" height="28" fill="#313638"/>
<text x="12" y="19" fill="white" font-weight="700">PCE console — Servers &amp; Endpoints › Workloads</text>
<text x="888" y="19" fill="#ccc" text-anchor="end" font-size="10">schematic of the PCE console — not a screenshot; labels may differ slightly by version</text><rect x="0" y="28" width="150" height="300" fill="#F0EDE6"/><text x="14" y="47" fill="#313638" font-weight="700">Dashboard</text><text x="14" y="71" fill="#313638" font-weight="700">Explore</text><text x="14" y="95" fill="#313638" font-weight="700">Servers &amp; Endpoints</text><rect x="6" y="105" width="138" height="20" rx="3" fill="#FF5500"/><text x="14" y="119" fill="white" font-weight="700">  Workloads</text><text x="22" y="143" fill="#313638">VENs</text><text x="14" y="167" fill="#313638" font-weight="700">Policy Objects</text><text x="14" y="191" fill="#313638" font-weight="700">Policies</text><text x="14" y="215" fill="#313638" font-weight="700">Settings</text><circle cx="150" cy="84" r="11" fill="#FF5500"/><text x="150" y="88" fill="white" text-anchor="middle" font-weight="700" font-size="12">1</text><rect x="170" y="44" width="400" height="28" rx="4" fill="white" stroke="#313638"/><text x="178" y="62.0" text-anchor="start" fill="#313638" font-size="12">Filter: Enforcement, Labels, Managed / Unmanaged …</text><rect x="580" y="44" width="110" height="28" rx="4" fill="white" stroke="#313638"/><text x="588" y="62.0" text-anchor="start" fill="#313638" font-size="12">Add ▾</text><rect x="700" y="44" width="90" height="28" rx="4" fill="white" stroke="#FF5500"/><text x="745.0" y="62.0" text-anchor="middle" fill="#313638" font-weight="700" font-size="12">⤓ Export</text><circle cx="700" cy="44" r="11" fill="#FF5500"/><text x="700" y="48" fill="white" text-anchor="middle" font-weight="700" font-size="12">2</text><rect x="170" y="86" width="720" height="22" fill="#313638"/><text x="176" y="101" fill="white" font-size="11" font-weight="700">Name</text><text x="330" y="101" fill="white" font-size="11" font-weight="700">Hostname</text><text x="440" y="101" fill="white" font-size="11" font-weight="700">Interfaces</text><text x="536" y="101" fill="white" font-size="11" font-weight="700">Enforcement</text><text x="616" y="101" fill="white" font-size="11" font-weight="700">Role</text><text x="662" y="101" fill="white" font-size="11" font-weight="700">App</text><text x="758" y="101" fill="white" font-size="11" font-weight="700">Env</text><text x="830" y="101" fill="white" font-size="11" font-weight="700">Loc</text><rect x="170" y="108" width="720" height="22" fill="white" stroke="#e5e2db"/><text x="176" y="123" fill="#313638" font-size="11">ord-app-01</text><text x="330" y="123" fill="#313638" font-size="11">ord-app-01.lab…</text><text x="440" y="123" fill="#313638" font-size="11">eth0:10.20.2.20</text><text x="536" y="123" fill="#313638" font-size="11">Visibility Only</text><text x="616" y="123" fill="#313638" font-size="11">App</text><text x="662" y="123" fill="#313638" font-size="11">Ordering</text><text x="758" y="123" fill="#313638" font-size="11">Production</text><text x="830" y="123" fill="#313638" font-size="11">DC1</text><rect x="170" y="130" width="720" height="22" fill="white" stroke="#e5e2db"/><text x="176" y="145" fill="#313638" font-size="11">Front-End Ord. 10.20.1.11</text><text x="330" y="145" fill="#313638" font-size="11">—</text><text x="440" y="145" fill="#313638" font-size="11">eth0:10.20.1.11</text><text x="536" y="145" fill="#313638" font-size="11">(unmanaged)</text><text x="616" y="145" fill="#313638" font-size="11">Web</text><text x="662" y="145" fill="#313638" font-size="11">Ordering</text><text x="758" y="145" fill="#313638" font-size="11">Production</text><text x="830" y="145" fill="#313638" font-size="11">DC1</text><rect x="170" y="152" width="720" height="22" fill="white" stroke="#e5e2db"/><text x="176" y="167" fill="#313638" font-size="11">DNS Corporativo 10.10.0.53</text><text x="330" y="167" fill="#313638" font-size="11">—</text><text x="440" y="167" fill="#313638" font-size="11">eth0:10.10.0.53</text><text x="536" y="167" fill="#313638" font-size="11">(unmanaged)</text><text x="616" y="167" fill="#313638" font-size="11">DNS</text><text x="662" y="167" fill="#313638" font-size="11">Shared Services</text><text x="758" y="167" fill="#313638" font-size="11">Production</text><text x="830" y="167" fill="#313638" font-size="11">DC1</text><text x="170" y="200" fill="#313638" font-size="11">1 Servers &amp; Endpoints › Workloads lists managed (VEN) and unmanaged workloads with their labels</text><text x="170" y="216" fill="#313638" font-size="11">2 Export downloads the list as CSV (the same data as `workloader wkld-export`, which is what the kit uses)</text><text x="170" y="232" fill="#313638" font-size="11">Expected file: one row per workload with href, hostname, name, interfaces, managed, labels — the kit reconciles the proposals against it by IP</text><rect x="170" y="258" width="720" height="60" rx="4" fill="#F7F4EE" stroke="#8A8D8F"/><text x="180" y="278" fill="#313638" font-size="11" font-weight="700">Terminal equivalent (recommended, no clicks):</text><text x="180" y="294" fill="#313638" font-size="11" font-family="Menlo, monospace">./workloader wkld-export --output-file pce-workloads.csv</text><text x="180" y="308" fill="#313638" font-size="11" font-family="Menlo, monospace">./workloader label-export --output-file pce-labels.csv   ./workloader ipl-export --output-file pce-iplists.csv</text></svg>