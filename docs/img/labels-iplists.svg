<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="900" height="300" fill="white"/>
<rect x="0" y="0" width="900" height="28" fill="#313638"/>
<text x="12" y="19" fill="white" font-weight="700">PCE console — Policy Objects › Labels and Label Settings / IP Lists</text>
<text x="888" y="19" fill="#ccc" text-anchor="end" font-size="10">schematic of the PCE console — not a screenshot; labels may differ slightly by version</text><rect x="0" y="28" width="150" height="270" fill="#F0EDE6"/><text x="14" y="47" fill="#313638" font-weight="700">Dashboard</text><text x="14" y="71" fill="#313638" font-weight="700">Explore</text><text x="14" y="95" fill="#313638" font-weight="700">Servers &amp; Endpoints</text><text x="14" y="119" fill="#313638" font-weight="700">Policy Objects</text><rect x="6" y="129" width="138" height="20" rx="3" fill="#FF5500"/><text x="14" y="143" fill="white" font-weight="700">  Labels</text><text x="22" y="167" fill="#313638">Label Groups</text><text x="22" y="191" fill="#313638">IP Lists</text><text x="22" y="215" fill="#313638">Services</text><text x="14" y="239" fill="#313638" font-weight="700">Settings</text><text x="22" y="263" fill="#313638">Label Settings</text><circle cx="150" cy="108" r="11" fill="#FF5500"/><text x="150" y="112" fill="white" text-anchor="middle" font-weight="700" font-size="12">1</text><circle cx="150" cy="156" r="11" fill="#FF5500"/><text x="150" y="160" fill="white" text-anchor="middle" font-weight="700" font-size="12">3</text><circle cx="150" cy="252" r="11" fill="#FF5500"/><text x="150" y="256" fill="white" text-anchor="middle" font-weight="700" font-size="12">2</text><rect x="170" y="44" width="300" height="28" rx="4" fill="white" stroke="#313638"/><text x="178" y="62.0" text-anchor="start" fill="#313638" font-size="12">Labels — filter by type: role | app | env | loc</text><rect x="480" y="44" width="90" height="28" rx="4" fill="white" stroke="#FF5500"/><text x="525.0" y="62.0" text-anchor="middle" fill="#313638" font-weight="700" font-size="12">⤓ Export</text><rect x="170" y="86" width="720" height="22" fill="white" stroke="#e5e2db"/><text x="176" y="101" fill="#313638" font-size="11" font-weight="700">role</text><text x="260" y="101" fill="#313638" font-size="11">R_LoadBalancer, R_DNS, R_WebServer, R_Database …</text><rect x="170" y="108" width="720" height="22" fill="white" stroke="#e5e2db"/><text x="176" y="123" fill="#313638" font-size="11" font-weight="700">app</text><text x="260" y="123" fill="#313638" font-size="11">A_Atun4App, A_CoreInfra, A_EcomApp …</text><rect x="170" y="130" width="720" height="22" fill="white" stroke="#e5e2db"/><text x="176" y="145" fill="#313638" font-size="11" font-weight="700">env</text><text x="260" y="145" fill="#313638" font-size="11">E_Prod</text><rect x="170" y="152" width="720" height="22" fill="white" stroke="#e5e2db"/><text x="176" y="167" fill="#313638" font-size="11" font-weight="700">loc</text><text x="260" y="167" fill="#313638" font-size="11">L_CDLV, L_OCI</text><text x="170" y="190" fill="#313638" font-size="11">1 Policy Objects › Labels: existing values per type. Export them so the analysis reuses the customer's nomenclature (R_/A_/E_/L_).</text><text x="170" y="206" fill="#313638" font-size="11">2 Settings › Label Settings: the label TYPES. A CSV column that is not a type is ignored by workloader; create the type first.</text><text x="170" y="222" fill="#313638" font-size="11">3 Policy Objects › IP Lists: existing lists (corporate networks). Export them so the analysis does not propose duplicates.</text><rect x="170" y="248" width="720" height="40" rx="4" fill="#F7F4EE" stroke="#8A8D8F"/><text x="180" y="266" fill="#313638" font-size="11" font-family="Menlo, monospace">./workloader label-export --output-file pce-labels.csv      ./workloader ipl-export --output-file pce-iplists.csv</text><text x="180" y="281" fill="#313638" font-size="11" font-family="Menlo, monospace">./workloader label-dimension-export --output-file pce-label-types.csv</text></svg>